<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Mseto Junior School | Downloads</title>
    <style>
        :root { 
            --bg-color: #0b0f19; 
            --footer-bg: #131a2e; /* Distinct slightly deeper tone for footer separation */
            --text-main: #f8fafc; 
            --text-muted: #a0aec0; 
            --accent-cyan: #38bdf8; 
            --accent-red: #ef4444; 
            --border-color: #1f293d; 
        }

        body.light-mode { 
            --bg-color: #ffffff; 
            --footer-bg: #e2e8f0; /* Distinct contrast tone for light mode footer */
            --text-main: #1e293b; 
            --text-muted: #475569; 
            --border-color: #cbd5e1; 
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 0; 
            line-height: 1.6; 
            transition: background-color 0.3s, color 0.3s; 
        }

        header { 
            background-color: var(--bg-color); 
            padding: 15px 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--accent-red); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            transition: background-color 0.3s;
        }
        .logo-container { display: flex; align-items: center; gap: 15px; }
        .school-logo-img { width: 50px; height: 50px; object-fit: contain; border-radius: 50%; border: 2px solid var(--accent-cyan); }
        .brand-name { font-size: 1.3rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        
        nav { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        nav a { color: var(--text-main); text-decoration: none; font-weight: 500; font-size: 0.9rem; transition: color 0.3s; white-space: nowrap; }
        nav a:hover, nav a.active { color: var(--accent-cyan); }
        .theme-btn { cursor: pointer; background: rgba(255, 255, 255, 0.1); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); padding: 5px 10px; border-radius: 4px; font-weight: 500; font-size: 0.85rem; }
        .menu-toggle { display: none; background: none; border: none; color: var(--text-main); font-size: 1.8rem; cursor: pointer; }
        
        .hero { 
            min-height: 65vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; 
            align-items: flex-start; 
            padding: 60px 8%; 
            border-bottom: 4px solid var(--accent-cyan);
            background: linear-gradient(to top, rgba(11, 15, 25, 0.95) 10%, rgba(11, 15, 25, 0.4) 60%), url('IMG-20260718-WA0062.jpg');
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat;
        }
        .hero-subtitle { font-size: 1.1rem; color: var(--accent-cyan); font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 5px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .hero h1 { font-size: 3.2rem; margin: 0 0 20px 0; color: #ffffff; text-shadow: 0 2px 6px rgba(0,0,0,0.8); max-width: 800px; }
        
        .content-section { padding: 60px 5%; max-width: 1000px; margin: 0 auto; }
        
        /* Distinct Gradients */
        .gradient-sunrise {
            background: linear-gradient(135deg, #f59e0b 0%, #ec4899 50%, #8b5cf6 100%);
            border: 1px solid #f472b6;
        }
        .gradient-teal {
            background: linear-gradient(135deg, #06b6d4 0%, #0284c7 50%, #0f766e 100%);
            border: 1px solid #38bdf8;
        }

        .download-list { display: flex; flex-direction: column; gap: 20px; margin-top: 30px; }
        
        .download-item { 
            border-radius: 8px; 
            padding: 20px 25px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .download-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        .download-item h3 { 
            margin: 0 0 5px 0; 
            color: #ffffff; 
            text-shadow: 0 1px 3px rgba(0,0,0,0.4); 
            font-size: 1.2rem; 
        }
