<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mseto Junior School | Gallery</title>
    <style>
        :root { 
            --bg-color: #0b0f19; --card-bg: #1e2640; --text-main: #f8fafc; 
            --text-muted: #a0aec0; --accent-cyan: #38bdf8; --accent-red: #ef4444; --border-color: #1f293d; 
        }
        body.light-mode { 
            --bg-color: #ffffff; --card-bg: #f1f5f9; --text-main: #1e293b; 
            --text-muted: #64748b; --border-color: #cbd5e1; 
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; line-height: 1.6; transition: background-color 0.3s, color 0.3s; }
        header { background-color: var(--bg-color); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent-red); position: sticky; top: 0; z-index: 1000; }
        .logo-container { display: flex; align-items: center; gap: 15px; }
        .school-badge { width: 45px; height: 50px; }
        .brand-name { font-size: 1.3rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        nav { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        nav a { color: var(--text-main); text-decoration: none; font-weight: 500; font-size: 0.9rem; transition: color 0.3s; white-space: nowrap; }
        nav a:hover, nav a.active { color: var(--accent-cyan); }
        .theme-btn { cursor: pointer; background: var(--card-bg); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); padding: 5px 10px; border-radius: 4px; font-weight: 500; font-size: 0.85rem; }
        .menu-toggle { display: none; background: none; border: none; color: var(--text-main); font-size: 1.8rem; cursor: pointer; }
        .hero { 
            min-height: 65vh; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; padding: 60px 8%; border-bottom: 4px solid var(--accent-cyan);
            background: linear-gradient(to top, rgba(11, 15, 25, 0.95) 10%, rgba(11, 15, 25, 0.4) 60%), url('IMG-20260718-WA0056_1786363184242.jpg');
            background-size: cover; background-position: center; background-repeat: no-repeat;
        }
        .hero-subtitle { font-size: 1.1rem; color: var(--accent-cyan); font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 5px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .hero h1 { font-size: 3.2rem; margin: 0 0 20px 0; color: #ffffff; text-shadow: 0 2px 6px rgba(0,0,0,0.8); max-width: 800px; }
        .content-section { padding: 60px 5%; max-width: 1200px; margin: 0 auto; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
        .gallery-item { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .gallery-item img { width: 100%; height: 220px; object-fit: cover; display: block; }
        .gallery-caption { padding: 15px; font-size: 0.95color: var(--text-muted); text-align: center; }
        footer { background-color: #05080f; padding: 30px 5%; text-align: center; border-top: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.9rem; }
        @media (max-width: 1024px) {
            .menu-toggle { display: block; }
            nav { display: none; flex-direction: column; width: 100%; background-color: var(--card-bg); position: absolute; top: 100%; left: 0; padding: 20px 5%; border-bottom: 2px solid var(--accent-cyan); box-shadow: 0 10px 20px rgba(0,0,0,0.3); align-items: flex-start; gap: 15px; }
            nav.active { display: flex; }
            nav a { font-size: 1.1rem; width: 100%; padding: 5px 0; border-bottom: 1px solid var(--border-color); }
            .hero h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>
    <script>if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); }</script>
    <header>
        <div class="logo-container">
            <div class="school-badge">
                <svg viewBox="0 0 100 110" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10,20 L90,20 L80,80 L50,105 L20,80 Z" fill="none" stroke="#38bdf8" stroke-width="4"></path>
                    <path d="M16,25 L84,25 L75,76 L50,98 L25,76 Z" fill="none" stroke="#38bdf8" stroke-width="1.5"></path>
                    <text x="50" y="13" fill="#ef4444" font-size="8.5" font-weight="bold" text-anchor="middle">Proverbs 22:6</text>
                    <path d="M5,82 L20,78 L35,84 L50,81 L65,84 L80,78 L95,82 L90,92 L50,96 L10,92 Z" fill="#38bdf8" stroke="none"></path>
                    <text x="50" y="90" fill="#ef4444" font-size="5" font-weight="bold" text-anchor="middle">LEARNERS TODAY LEADERS TOMORROW</text>
                </svg>
            </div>
            <div class="brand-name">Mseto School</div>
        </div>
        <button class="menu-toggle" onclick="toggleMenu()">&#9776;</button>
        <nav id="nav-menu">
            <a href="index.html">Home</a>
            <a href="academics.html">Academics</a>
            <a href="sports.html">Sports & Clubs</a>
            <a href="admissions.html">Admissions</a>
            <a href="downloads.html">Downloads</a>
            <a href="announcements.html">Announcements</a>
            <a href="gallery.html" class="active">Gallery</a>
            <button id="theme-btn" class="theme-btn" onclick="toggleTheme()">Mode</button>
        </nav>
    </header>
    <section class="hero">
        <div class="hero-subtitle">Photo Gallery</div>
        <h1>Captured Moments</h1>
    </section>
    <section class="content-section">
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="IMG-20260718-WA0062.jpg" alt="School Trip">
                <div class="gallery-caption">Educational Trip Exploration</div>
            </div>
            <div class="gallery-item">
                <img src="IMG-20260718-WA0076.jpg" alt="School Activities">
                <div class="gallery-caption">Learners in Action</div>
            </div>
            <div class="gallery-item">
                <img src="IMG-20260718-WA0056_1786363184242.jpg" alt="Group Photo">
                <div class="gallery-caption">School Group Excursion</div>
            </div>
        </div>
    </section>
    <footer><p>&copy; 2026 Mseto Junior School. All rights reserved.</p></footer>
    <script>
        function toggleMenu() { document.getElementById('nav-menu').classList.toggle('active'); }
        const btn = document.getElementById('theme-btn');
        btn.textContent = document.body.classList.contains('light-mode') ? 'Dark' : 'Light';
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
            btn.textContent = document.body.classList.contains('light-mode') ? 'Dark' : 'Light';
        }
    </script>
</body>
</html>
