<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Mseto Junior School | Learners Today, Leaders Tomorrow</title>
    <style>
        html {
            scroll-behavior: smooth;
        }

        :root { 
            --bg-color: #f8fafc; 
            --footer-bg: #e2e8f0; 
            --text-main: #1e293b; 
            --text-muted: #475569; 
            --accent-cyan: #0284c7; 
            --accent-red: #dc2626; 
            --border-color: #cbd5e1; 
        }

        body.dark-mode { 
            --bg-color: #0b0f19; 
            --footer-bg: #131a2e; 
            --text-main: #f8fafc; 
            --text-muted: #f8fafc; 
            --accent-cyan: #38bdf8; 
            --accent-red: #ef4444; 
            --border-color: #1f293d; 
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 0;
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Navigation Header */
        header { 
            background-color: var(--bg-color); 
            padding: 15px 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--accent-red); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            transition: background-color 0.3s;
        }
        .logo-container { display: flex; align-items: center; gap: 15px; }
        .school-logo-img { width: 50px; height: 50px; object-fit: contain; border-radius: 50%; border: 2px solid var(--accent-cyan); }
        .brand-name { font-size: 1.5rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        
        nav { display: flex; gap: 20px; align-items: center; }
        nav a { color: var(--text-main); text-decoration: none; font-weight: 500; font-size: 0.95rem; transition: color 0.3s; }
        nav a:hover, nav a.active { color: var(--accent-cyan); }
        .theme-btn { cursor: pointer; background: rgba(255, 255, 255, 0.2); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); padding: 6px 12px; border-radius: 4px; font-weight: 500; }
